name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  # The GitHub release, with the WebAssembly module and the JavaScript loader.
  # It does not depend on crates.io.
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "kraken-decode") | .version')
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml version $manifest"
            exit 1
          fi

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --release

      # The WebAssembly module and the single-file JavaScript loader, attached
      # to the release for consumers that do not build Rust.
      - run: cargo build -p kraken-decode-wasm --target wasm32-unknown-unknown --release
      - run: node js/build.mjs
      - run: node --test js/test.mjs
      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir release
          cp js/dist/kraken-decode.mjs js/index.d.ts release/
          cp target/wasm32-unknown-unknown/release/kraken_decode_wasm.wasm release/kraken-decode.wasm
          cp js/index.d.ts release/kraken-decode.d.mts
          rm release/index.d.ts
          (cd release && sha256sum kraken-decode.mjs kraken-decode.d.mts kraken-decode.wasm > SHA256SUMS)
          cat release/SHA256SUMS

      - run: cargo publish -p kraken-decode --dry-run

      - name: Extract changelog section
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found && /^\[[^]]+\]: / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No changelog section found for $version; release notes will be empty"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            $prerelease_flag \
            release/kraken-decode.mjs release/kraken-decode.d.mts release/kraken-decode.wasm release/SHA256SUMS

  # crates.io, by trusted publishing. Off until the repository variable
  # CRATES_IO_TRUSTED_PUBLISHING is "true": crates.io only lets a trusted
  # publisher be set on a crate that exists, so the first version is
  # published by hand.
  publish:
    name: Publish to crates.io
    needs: release
    if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p kraken-decode
