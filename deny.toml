# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

# The crate has no runtime dependencies. This list covers the test-only ones,
# and says what would be acceptable if one were ever added: permissive only.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Decoders of the same format under licences this crate cannot take code from.
# Depending on one, even for tests, would defeat the point of the crate.
deny = [
    { crate = "oozextract", reason = "see CONTRIBUTING.md, the clean-room rule" },
    { crate = "oozle", reason = "see CONTRIBUTING.md, the clean-room rule" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
